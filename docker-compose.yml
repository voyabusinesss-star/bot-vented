services:
  db:
    image: postgres:16-alpine
    container_name: vinted_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vinted
      POSTGRES_PASSWORD: vinted
      POSTGRES_DB: vinted_bot
    ports:
      - "5432:5432"
    volumes:
      - vinted_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinted -d vinted_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vinted_pg_data:
