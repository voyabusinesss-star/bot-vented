[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck désactivé temporairement : le service doit d'abord
# avoir un domaine public + Variables (sinon Railway échoue au Network).
# Réactiver ensuite : healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
