# Détecteur de niches — sondes exploratoires autonomes
# Objectif : trouver des niches INEXPLOITÉES / sous-évaluées
# sur TOUTES les catégories Vinted (pas seulement vêtements / chaussures)
#
# Lance via : uv run vinted-bot detector --loop

defaults:
  # [] = probes sans filtre catalogue (recherche globale)
  catalog_ids: []
  max_items_per_probe: 24
  max_items_per_catalog: 24
  # Combien de catalogues balayer par cycle (rotation) — limité anti-ban
  catalog_sweep_per_cycle: 3
  loop_interval_seconds: 600
  delay_between_probes_seconds: 4.5
  min_samples: 5
  min_margin_pct: 25
  min_margin_eur: 12
  niche_cooldown_hours: 12
  max_discord_posts_per_cycle: 1

# Balayage newest multi-domaines (rotation à chaque cycle)
# id: all = flux site entier ; sinon ID catalogue Vinted FR
discovery_catalogs:
  - id: all
    label: "Tout Vinted"
  - id: 4
    label: "Vêtements femmes"
  - id: 5
    label: "Vêtements hommes"
  - id: 1231
    label: "Chaussures femmes"
  - id: 1242
    label: "Chaussures hommes"
  - id: 1193
    label: "Enfants"
  - id: 1918
    label: "Maison"
  - id: 2993
    label: "Divertissement / électronique"

# Probes découverte — produits / licences / objets / micro-niches
# (volontairement hors ultra-marques saturées)
probes:
