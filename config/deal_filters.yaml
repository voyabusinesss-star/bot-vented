# Filtrage intelligent revente — MARQUE × CATÉGORIE
#
# Pour ajouter une marque :
#   1. Entrée sous `brands:` (clé = marque normalisée, underscores OK)
#   2. Catégories sous `items:` avec max_buy / average_resell / minimum_profit / rarity
#   3. (optionnel) salon Discord + searches.yaml comme avant
#
# Aucune modification de code nécessaire.
#
# rarity: low | medium | high | ultra
# Une annonce est postée si score >= min_score_to_post ET
#   (prix <= max_buy_price) OU (marge >= minimum_profit)

settings:
  enabled: true
  # Score minimum pour poster (👀 SURVEILLANCE = 60)
  min_score_to_post: 60
  # Si true : marques absentes de ce fichier = jamais postées
  require_brand_config: true
  # Si true : préfère un match catégorie (sinon fallback médian)
  require_category_match: true
  # Titre ambigu → fallback prix médian marque (ne rate pas l'annonce)
  use_category_fallback: true
  # Ignore les annonces en ligne depuis plus de X minutes (null = pas de limite)
  # 90 min : laisse le temps à la rotation multi-marques (Railway)
  max_listing_age_minutes: 90
  # Filtre enfant (titre + taille uniquement — pas de photos / description)
  reject_kids: true
  # Pas de chaussures sauf marques avec allow_shoes: true (luxe)
  reject_shoes_unless_allowed: true
  # Rejette replica / fake / 1:1
  reject_replicas: true

# Signaux ENFANT clairs uniquement.
# XL / XXL / XXXL adultes ne sont JAMAIS exclus pour la taille seule.
# Pas de "fille" / "garçon" : trop ambigus (coupe, style, destinataire).
kids_filter:
  title_keywords:
    - enfant
    - enfants
    - kids
    - kid
    - junior
    - bebe
    - bébé
    - baby
    - layette
  # Âge explicite dans titre ou taille (ex. "12 ans", "10-12 ans")
  age_patterns:
    - "\\b([1-9]|1[0-6])\\s*ans?\\b"
    - "\\b([1-9]|1[0-6])\\s*-\\s*([1-9]|1[0-6])\\s*ans?\\b"
    - "\\b(1[0-6]|[4-9])\\s*-\\s*(1[0-6]|[4-9])\\s*a\\b"
  # Tailles kids — pas les lettres adultes (XL/XXL restent OK)
  size_keywords:
    - mois
    - years
    - yrs
  size_patterns:
    - "\\b(9[8-9]|1[0-5]\\d|16[0-4])\\s*cm\\b"   # ~98–164 cm
    - "\\b(t|taille)?\\s*(2|4|6|8|10|12|14|16)\\s*ans?\\b"
  # Tailles adultes explicites : taille seule = never reject
  adult_size_allowlist:
    - xxs
    - xs
    - s
    - m
    - l
    - xl
    - xxl
    - xxxl
    - 2xl
    - 3xl
    - 4xl
    - unique
    - tu
    - one size

