# Scoring /100 (poids relatifs, normalisés ensuite)
scoring:
  weights:
    margin: 30
    brand: 15
    rarity: 15
    category: 10
    below_market: 20
    freshness: 10
  rarity_points:
    low: 40
    medium: 60
    high: 80
    ultra: 100
  # Fraîcheur : minutes depuis publication → points /10 (×10 dans le score)
  freshness_minutes:
    5: 10
    15: 8
    60: 5
    360: 2
  levels:
    pepite: 90          # > 90 → 🔥 PÉPITE
    bon_deal: 75        # 75–90 → 💎 BON DEAL
    surveillance: 60    # 60–75 → 👀 SURVEILLANCE

