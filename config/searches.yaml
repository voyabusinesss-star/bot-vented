defaults:
  max_items: 6
  # Pause minimale entre marques (fluidité)
  delay_between_searches_seconds: 0.15
  # Cycle quasi continu — les nouvelles annonces sont captées vite
  loop_interval_seconds: 5
  browser_restart_every_cycles: 25
  reconnect_delay_seconds: 15
  # Alerte si un cycle dure > factor * moyenne mobile
  slow_cycle_factor: 2.0
  order: newest_first
  # Vêtements uniquement (pas chaussures / sacs / accessoires)
  # 4 = Femmes > Vêtements, 5 = Hommes > Vêtements
  catalog_ids: [4, 5]
  # Max posts Discord par marque et passage (filtre deal + âge avant)
  max_discord_posts: 5
