  - brand: nike
    query: nike
    brand_ids: [53]
    # Vêtements → salon Nike indémodables + ALL
    catalog_ids: [4, 5]
    priority: high
    enabled: true
  - brand: nike
    query: nike
    brand_ids: [53]
    # Chaussures → Pépites Sneakers (DISCORD_CHANNEL_NIKE_SNEAKERS)
    catalog_ids: [1231, 1242]
    priority: high
    enabled: true
