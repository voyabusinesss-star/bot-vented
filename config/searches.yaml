# Recherches à scraper.
# Pour ajouter une marque :
#   1. entrée ici (brand + brand_ids Vinted)
#   2. DISCORD_CHANNEL_* dans .env
#   3. bloc brands: dans deal_filters.yaml
#
# priority: high | medium | low  (fréquence via section priorities)
# brand_ids : IDs Vinted (filtre API précis, moins de bruit)
# optionnel: catalog_ids, every_n_cycles, extra_passes, max_items, poll_seconds
# poll_seconds : override cadence d'une marque (sinon priorities.poll_interval_seconds)
# Par défaut catalog_ids = [4, 5] (vêtements F/H) → pas de chaussures.

priorities:
  # Railway 1 Go proxy : cadence lente (voir SCRAPE_POLL_SECONDS_* en env)
  high:
    every_n_cycles: 1
    extra_passes: 0
    max_items: 12
    max_discord_posts: 6
    poll_interval_seconds: 8.0
  medium:
    every_n_cycles: 2
    extra_passes: 0
    max_items: 10
    max_discord_posts: 4
    poll_interval_seconds: 15.0
  low:
    every_n_cycles: 3
    extra_passes: 0
    max_items: 8
    max_discord_posts: 2
    poll_interval_seconds: 25.0

searches:
