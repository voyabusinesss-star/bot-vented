# Radar tendances — mouvements de marché (pas produits / pépites)
defaults:
  min_samples_short: 5
  min_samples_long: 8
  volume_surge_ratio: 1.7
  volume_drop_ratio: 0.45
  price_up_pct: 10.0
  price_down_pct: 12.0
  scarcity_active_max: 18
  scarcity_new_7d_min: 5
  new_entity_long_max: 10
  new_entity_short_min: 5
  min_token_len: 4
  min_token_listings: 5
  max_trends_posted: 8
  lookback_days: 90
  min_publish_score: 50
  saturation_active_min: 45
  # Trop vagues seuls (jamais une tendance Niveau 1)
  exclude_topic_kinds: ["color"]
  vague_alone_slugs:
    - sac
    - vintage_obj
    - bijou
    - livre
    - jouet
    - deco
    - montre
    - parfum
    - figurine
    - peluche
    - console
    - jeu_video
    - manga_tome
    - chaussure
    - vetement

