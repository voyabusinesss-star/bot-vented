[project]
name = "vinted-bot"
version = "0.1.0"
description = "Bot de scraping Vinted — récupération d'annonces"
readme = "README.md"
authors = [
    { name = "Faustin", email = "Faustin@Vintify.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "playwright>=1.61.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
]

[project.scripts]
vinted-bot = "vinted_bot:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
